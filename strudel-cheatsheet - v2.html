<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strudel REPL Guide</title>
<style>
  :root{
    --bg: #0d1117;
    --bg-panel: #141c2c;
    --bg-card: #1a2436;
    --bg-hover: #1f2a3d;
    --ink: #dbe4f0;
    --ink-dim: #8291a8;
    --rule: #263248;
    --mono: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: 'Inter', system-ui, sans-serif;

    --c-mini:   #f7b955;
    --c-sound:  #7ee081;
    --c-fx:     #d888f5;
    --c-time:   #ff8a65;
    --c-prob:   #ff6b81;
    --c-missed: #4dd0c4;
    --c-ex:     #58a6ff;
    --c-learn:  #f0883e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html,body{
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--c-ex); text-decoration: none; }

  main{
    padding: 8px 12px 40px;
    max-width: 100%;
    margin: 0;
    column-count: 4;
    column-gap: 8px;
  }

  section.cat{
    background: var(--bg-panel);
    border: 1px solid var(--rule);
    border-radius: 5px;
    overflow: hidden;
    break-inside: avoid;
    margin-bottom: 0;
  }
  section.cat.hidden { display: none; }

  .cat-head{
    display:flex; align-items:center; gap:5px;
    padding: 4px 8px;
    border-bottom: 1px solid var(--rule);
    cursor: pointer;
    user-select:none;
    background: var(--bg-panel);
  }
  .cat-head:hover { background: var(--bg-card); }
  .cat-head .bar{
    width: 3px; height: 12px; border-radius: 2px; flex:none;
  }
  .cat-head .emoji{ font-size: 0.8rem; }
  .cat-head .title{
    font-family: var(--mono);
    font-size: 0.7rem;
    font-weight: 600;
    flex: 1;
  }
  .cat-head .arrow{
    color: var(--ink-dim);
    font-size: 0.55rem;
    transition: transform .15s;
  }
  .cat.collapsed .arrow { transform: rotate(-90deg); }
  .cat.collapsed .cat-body { display: none; }

  .cat-body{ padding: 3px 6px 6px; }

  .row{
    display:flex; align-items:baseline; gap:5px;
    padding: 1.5px 4px;
    border-radius: 2px;
    line-height: 1.3;
  }
  .row:hover { background: var(--bg-card); }

  .k{
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--ink);
    white-space: nowrap;
    cursor: pointer;
    background: rgba(255,255,255,0.03);
    padding: 1px 3px;
    border-radius: 2px;
    flex-shrink: 0;
    transition: background .12s;
  }
  .k:hover { background: rgba(255,255,255,0.1); }

  .d{
    color: var(--ink-dim);
    font-size: 0.68rem;
    line-height: 1.25;
    word-break: break-word;
  }

  .op { font-family: var(--mono); color: var(--ink); font-weight: 600; font-size: 0.68rem; }

  footer{
    text-align:center;
    color: var(--ink-dim);
    font-size: 0.65rem;
    padding: 6px 12px 24px;
    font-family: var(--mono);
  }
  footer a { color: var(--c-missed); border-bottom: 1px dotted var(--c-missed); }

  .toast{
    position: fixed;
    bottom: 12px; left: 50%;
    transform: translateX(-50%) translateY(30px);
    background: var(--bg-card);
    border: 1px solid var(--c-ui);
    color: var(--c-ui);
    font-family: var(--mono);
    font-size: 0.68rem;
    padding: 3px 8px;
    border-radius: 3px;
    pointer-events: none;
    opacity: 0;
    transition: all .18s;
    z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 700px){
    main{ grid-template-columns: 1fr; }
    .legend { display:none; }
  }
</style>
</head>
<body>

<main id="main"></main>
<div class="toast" id="toast">copied!</div>

<footer>
  click any code to copy &middot; <a href="https://strudel.cc" target="_blank">strudel.cc</a> / <a href="https://strudel.cc/workshop/recap/" target="_blank">recap</a>
</footer>

<script>
const DATA = [
  {
    id: "start", emoji: "🚀", title: "START HERE", color: "var(--c-learn)",
    items: [
      { type: "tip", html: "Open <a href='https://strudel.cc' target='_blank'>strudel.cc</a> &rarr; paste a block below &rarr; <strong>Ctrl+Enter</strong> to play &rarr; <strong>Ctrl+.</strong> to stop." },
      { type: "ex", label: "Basic Beat", code: 'setcpm(100/4)\nsound("bd*4, [- cp]*2, [- hh]*4").bank("RolandTR909")' },
      { type: "ex", label: "Classic House", code: 'sound("bd*4, [- cp]*2, [- hh]*4").bank("RolandTR909")' },
      { type: "ex", label: "Rock", code: 'setcpm(81/2)\nsound("bd*2 cp").bank("RolandTR707")' },
      { type: "ex", label: "Note + Filter", code: 'setcpm(60)\nnote("c2 [eb3,g3]").sound("sawtooth").lpf(800)' },
      { type: "ex", label: "Stack Layers", code: '$: sound("bd*4, [- cp]*2")\n$: note("c2 [eb3,g3]").sound("sawtooth").lpf(800)' },
      { type: "ex", label: "Dub", code: '$: note("[~ [<[d3,a3,f4]!2 [d3,bb3,g4]!2> ~]]*2").sound("gm_electric_guitar_muted").delay(.5)\n$: sound("bd rim").bank("RolandTR707").delay(.5)\n$: n("<4 [3@3 4] [<2 0> ~@16] ~>").scale("D4:minor").sound("gm_accordion:2").room(2).gain(.4)' },
    ]
  },
  {
    id: "mini", emoji: "🥁", title: "MINI-NOTATION", color: "var(--c-mini)",
    items: [
      ['"bd sd"', "space = sequence"],
      ['"bd [sd hh]"', "[ ] = sub-sequence"],
      ['"bd [sd hh, cp]"', ", = together"],
      ['"bd*4"', "* = faster"],
      ['"bd/2"', "/ = slower"],
      ['"bd ~ sd"', "~ = rest"],
      ['"<bd sd>"', "<> = alternate"],
      ['"bd(3,8)"', "(n,m) = euclidean"],
      ['"hh:2"', ":x = sample #"],
      ['"bd!3"', "! = repeat prev"],
      ['"bd@3"', "@ = longer step"],
      ['"{bd, hh*2}"', "{ } = polymeter"],
      ['"bd _ sd"', "_ = elongate step"],
    ]
  },
  {
    id: "snd", emoji: "🎹", title: "SOUND / NOTES", color: "var(--c-sound)",
    items: [
      ['s("bd")', "play sample"],
      ['bank("TR909")', "drum machine"],
      ['note("c e g")', "note names"],
      ['n("0 2 4")', "note numbers"],
      ['.scale("C:minor")', "apply scale"],
      ['.sound("piano")', "synth/sample"],
      ['setcpm(120)', "tempo (cpm)"],
      ['$: pat', "stack pattern"],
      ['stack(a,b)', "explicit stack"],
      ['cat(a,b)', "concat patterns"],
      ['hush()', "stop all"],
    ]
  },
  {
    id: "fx", emoji: "🎛️", title: "EFFECTS", color: "var(--c-fx)",
    items: [
      ['.gain(.8)', "volume 0–1"],
      ['.pan("0 1")', "stereo L/R"],
      ['.room(.5)', "reverb"],
      ['.delay(.5)', "echo"],
      ['.lpf(1000)', "low-pass"],
      ['.hpf(500)', "high-pass"],
      ['.bpf(800)', "band-pass"],
      ['.vowel("a")', "vocal filter"],
      ['.speed(1.5)', "playback speed"],
      ['.legato(1)', "note overlap"],
      ['.attack(.1)', "adsr attack"],
      ['.decay(.1)', "adsr decay"],
      ['.sustain(.5)', "adsr sustain"],
      ['.release(.2)', "adsr release"],
      ['.fm(sine)', "fm synthesis"],
      ['.shape(.3)', "distortion"],
      ['.color("cyan")', "pianoroll color"],
      ['.size(4)', "3D spatial"],
    ]
  },
  {
    id: "time", emoji: "⏳", title: "TIME / FLOW", color: "var(--c-time)",
    items: [
      ['.fast(2)', "speed up"],
      ['.slow(2)', "slow down"],
      ['.rev()', "reverse"],
      ['.jux(rev)', "left/right split"],
      ['.off(1/8,f)', "echo+transform"],
      ['.early(.5)', "shift earlier"],
      ['.late("0 .01")', "shift later"],
      ['.chunk(4,f)', "every 4th block"],
      ['.every(4,f)', "every 4th cycle"],
      ['.iter(4)', "rotate start"],
      ['.ply(2)', "repeat event"],
      ['.segment(8)', "discretize signal"],
      ['.mask("1 0 1")', "silence steps"],
      ['.struct("1 0 1")', "bool rhythm"],
    ]
  },
  {
    id: "prob", emoji: "🎲", title: "PROBABILITY", color: "var(--c-prob)",
    items: [
      ['"bd? hh"', "? = ~50% drop"],
      ['.degradeBy(.2)', "-20% density"],
      ['.scramble(4)', "randomize order"],
      ['.shuffle(4)', "shuffle steps"],
      ['.often(f)', "apply ~75%"],
      ['.rarely(f)', "apply ~25%"],
      ['.sometimes(f)', "apply ~50%"],
      ['.almostAlways(f)', "apply ~90%"],
      ['.almostNever(f)', "apply ~10%"],
    ]
  },
  {
    id: "adv", emoji: "🧩", title: "ADVANCED", color: "var(--c-ui)",
    items: [
      ['.add(3)', "+ to values"],
      ['.transpose(3)', "shift pitch"],
      ['.add(12)', "octave up"],
      ['.range(0,1)', "scale signal"],
      ['.clip(0.5)', "clip signal"],
      ['.lpq(5)', "filter resonance"],
      ['.resonance(15)', "filter sharpness"],
      ['.sustain(0.5)', "adsr sustain"],
      ['.release(0.2)', "adsr release"],
      ['.mode("root:g2")', "scale mode"],
      ['.voicing()', "smart chords"],
      ['.anchor("D5")', "anchor pitch"],
      ['.palindrome()', "fwd+back"],
      ['.someCyclesBy(.3,f)', "per cycle"],
      ['.within(0,.5,f)', "in segment"],
      ['.compress(.25,.75,f)', "squeeze time"],
    ]
  },
  {
    id: "sig", emoji: "🌊", title: "SIGNALS", color: "var(--c-missed)",
    items: [
      ['sine', "sine 0-1"],
      ['saw', "sawtooth"],
      ['square', "square"],
      ['tri', "triangle"],
      ['rand', "random"],
      ['perlin', "smooth random"],
      ['.slow(4)', "slow signal"],
      ['.fast(4)', "fast signal"],
      ['', ''],
      ["ex:", 's("hh*16").gain(sine)'],
      ["ex:", 's("hh*16").lpf(saw.range(500,2000))'],
      ["ex:", 'n("c2 c3").lpf(sine.range(100,2000).slow(4))'],
    ]
  },
  {
    id: "sndref", emoji: "🔊", title: "SOUND REFERENCE", color: "var(--c-learn)",
    desc: "Default short-name drums, common banks, and synth waveforms.",
    items: [
      ['bd', "Bass drum / kick"],
      ['sd', "Snare drum"],
      ['hh', "Closed hi-hat"],
      ['oh', "Open hi-hat"],
      ['cp', "Clap"],
      ['ht', "High tom"],
      ['mt', "Mid tom"],
      ['lt', "Low tom"],
      ['rim', "Rimshot"],
      ['cb', "Cowbell"],
      ['cr', "Crash cymbal"],
      ['rd', "Ride cymbal"],
      ['misc', "Miscellaneous metal / scratch / shots"],
      ['perc', "General percussion"],
      ['--bank--', "--- DRUM BANKS ---"],
      ['.bank("RolandTR808")', "808 boomy/deep (hip-hop, electro)"],
      ['.bank("RolandTR909")', "909 punchy/snappy (house, techno)"],
      ['.bank("RolandTR707")', "707 classic 80s Roland"],
      ['.bank("LinnDrum")', "LinnDrum 1982, clean/crisp"],
      ['.bank("AkaiMPC60")', "MPC-60 samplers"],
      ['.bank("EmuSP12")', "E-mu SP-12 (default for short names)"],
      ['.bank("KorgM1")', "Korg M1"],
      ['--synth--', "--- BUILT-IN SYNTH WAVEFORMS ---"],
      ['"sine"', "sine wave synth"],
      ['"triangle"', "triangle wave synth"],
      ['"sawtooth"', "sawtooth wave synth"],
      ['"square"', "square wave synth"],
      ['"white"', "white noise"],
      ['"pink"', "pink noise"],
      ['"brown"', "brown noise"],
    ]
  },
  {
    id: "tip", emoji: "💡", title: "TIPS", color: "var(--c-learn)",
    items: [
      { type: "tip", html: "Ctrl+Enter = play/update. Ctrl+. = panic stop." },
      { type: "tip", html: "Everything loops. Use <strong>$:</strong> to stack. Use <strong>//</strong> to comment." },
      { type: "tip", html: "Cycle = 2s default (30 CPM). Inside mini: <strong>*</strong>=fast <strong>/</strong>=slow. Outside: <strong>.fast()/.slow()</strong>." },
      { type: "tip", html: "Strudel = TidalCycles in JS. Most Tidal patterns work with minor syntax tweaks." },
    ]
  },
];

let searchTerm = '';

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(() => {
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 900);
  });
}

function matchesFilter(item) {
  if (!searchTerm) return true;
  const term = searchTerm.toLowerCase();
  if (typeof item === 'string') return item.toLowerCase().includes(term);
  if (item.code) return item.code.toLowerCase().includes(term);
  if (item.html) return item.html.toLowerCase().includes(term);
  if (item.label) return item.label.toLowerCase().includes(term);
  return true;
}

function render() {
  const main = document.getElementById('main');
  main.innerHTML = '';

  DATA.forEach(cat => {
    if (searchTerm) {
      const hasVisible = cat.items.some(matchesFilter);
      if (!hasVisible) return;
    }

    const section = document.createElement('section');
    section.className = 'cat';
    section.dataset.id = cat.id;

    const head = document.createElement('div');
    head.className = 'cat-head';
    head.innerHTML = `<span class="bar" style="background:${cat.color}"></span><span class="emoji">${cat.emoji}</span><span class="title">${cat.title}</span><span class="arrow">▼</span>`;
    head.addEventListener('click', () => section.classList.toggle('collapsed'));
    section.appendChild(head);

    const body = document.createElement('div');
    body.className = 'cat-body';

    if (cat.id === 'start') {
      cat.items.forEach(item => {
        if (!matchesFilter(item)) return;
        if (item.type === 'tip') {
          const tip = document.createElement('div');
          tip.className = 'tip';
          tip.style.borderLeftColor = 'var(--c-ex)';
          tip.innerHTML = item.html;
          body.appendChild(tip);
        } else if (item.type === 'ex') {
          const div = document.createElement('div');
          div.className = 'row';
          div.style.cssText = 'background:var(--bg-card);border:1px solid var(--rule);border-radius:3px;padding:4px 8px;margin:2px 0;cursor:pointer;display:flex;flex-direction:column;gap:2px;';
          div.innerHTML = `<div style="font-family:var(--mono);font-size:0.6rem;color:var(--c-ex);text-transform:uppercase;letter-spacing:0.04em">${item.label}</div><code style="font-family:var(--mono);font-size:0.7rem;color:var(--ink);white-space:pre-wrap;word-break:break-word;line-height:1.35">${escapeHtml(item.code)}</code>`;
          div.addEventListener('click', () => copyText(item.code));
          body.appendChild(div);
        }
      });
    } else {
      cat.items.forEach(item => {
        if (!matchesFilter(item)) return;

        if (item.type === 'tip') {
          const tip = document.createElement('div');
          tip.className = 'tip';
          tip.innerHTML = item.html;
          body.appendChild(tip);
        } else if (typeof item === 'string') {
        } else if (item.length === 2) {
          const div = document.createElement('div');
          div.className = 'row';
          div.innerHTML = `<span class="k" title="click to copy">${escapeHtml(item[0])}</span><span class="d">${item[1]}</span>`;
          div.querySelector('.k').addEventListener('click', (e) => {
            e.stopPropagation();
            copyText(item[0]);
          });
          body.appendChild(div);
        } else if (typeof item[0] === 'string' && item[0].startsWith('ex:')) {
          const div = document.createElement('div');
          div.className = 'row';
          div.style.background = 'rgba(88,166,255,0.03)';
          div.innerHTML = `<span class="k" style="color:var(--c-ex)">${escapeHtml(item[1])}</span>`;
          div.querySelector('.k').addEventListener('click', (e) => {
            e.stopPropagation();
            copyText(item[1]);
          });
          body.appendChild(div);
        }
      });
    }

    section.appendChild(body);
    main.appendChild(section);
  });
}

render();
</script>

</body>
</html>
